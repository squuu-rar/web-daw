<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DAW & Step Sequencer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Web DAW <span class="version">v1.0</span></h1>
            <div class="transport-controls">
                <button id="play-stop-btn" class="btn-primary">Play</button>
                <div class="control-group">
                    <label for="bpm-range">BPM: <span id="bpm-val">120</span></label>
                    <input type="range" id="bpm-range" min="60" max="240" value="120">
                </div>
                <div class="control-group">
                    <label for="volume-range">Vol</label>
                    <input type="range" id="volume-range" min="0" max="1" step="0.01" value="0.7">
                </div>
                <div class="control-group">
                    <label for="cutoff-range">Cutoff</label>
                    <input type="range" id="cutoff-range" min="50" max="5000" step="1" value="2000">
                </div>
                <button id="export-btn" class="btn-secondary">Export .WAV</button>
            </div>
        </header>

        <main>
            <section class="sequencer-section">
                <h2>Step Sequencer</h2>
                <div id="sequencer-grid" class="grid-container">
                    <!-- Grid generated by JS -->
                </div>
            </section>

            <section class="synth-section">
                <div class="viz-container">
                    <canvas id="oscilloscope"></canvas>
                </div>
                <div class="keyboard-container">
                    <div id="keyboard" class="keyboard">
                        <!-- Keys generated by JS -->
                    </div>
                </div>
            </section>
        </main>

        <footer class="status-bar">
            <div id="status-text">Ready</div>
            <div class="status-info">Web Audio Engine: <span id="engine-status">Off</span></div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
