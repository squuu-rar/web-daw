<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DAW & Step Sequencer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="daw-container">
        <header>
            <h1>WEB DAW</h1>
            <div class="transport-controls">
                <button id="btn-play">START</button>
                <button id="btn-stop">STOP</button>
                <div class="control-group">
                    <label for="range-bpm">BPM: <span id="val-bpm">120</span></label>
                    <input type="range" id="range-bpm" min="60" max="240" value="120">
                </div>
                <div class="control-group">
                    <label for="range-vol">VOL: <span id="val-vol">0.8</span></label>
                    <input type="range" id="range-vol" min="0" max="1" step="0.1" value="0.8">
                </div>
                <div class="control-group">
                    <label for="range-cutoff">CUTOFF: <span id="val-cutoff">2000</span></label>
                    <input type="range" id="range-cutoff" min="50" max="5000" value="2000">
                </div>
                <button id="btn-export" class="btn-accent">EXPORT .WAV</button>
            </div>
        </header>

        <main>
            <section class="sequencer-section">
                <div id="sequencer-grid"></div>
            </section>

            <section class="synth-section">
                <div class="visualizer-container">
                    <canvas id="oscilloscope"></canvas>
                </div>
                <div id="keyboard"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
