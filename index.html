<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web DAW & Step Sequencer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app">
        <h2>Web DAW & Step Sequencer</h2>
        <div class="controls">
            <button id="play-stop-btn" class="btn btn-primary">Play</button>
            <span id="engine-status" class="status">Off</span>
            <div class="range-group">
                <label>BPM: <span id="bpm-val">120</span></label><input type="range" id="bpm-range" min="60" max="240" value="120">
            </div>
            <div class="range-group">
                <label>Volume: <input type="range" id="volume-range" min="0" max="1" step="0.01" value="0.7"></label>
            </div>
            <div class="range-group">
                <label>Filter Cutoff: <input type="range" id="cutoff-range" min="200" max="8000" step="20" value="2000"></label>
            </div>
            <button id="export-btn" class="btn btn-secondary">Export .WAV</button>
        </div>
        <canvas id="oscilloscope" class="oscilloscope"></canvas>
        <div id="sequencer-grid" class="sequencer-grid"></div>
        <div id="keyboard" class="keyboard"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
